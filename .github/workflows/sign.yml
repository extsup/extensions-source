name: Generate Keystore

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Key alias'
        required: true
        default: 'tachiyomi'
      keystore_password:
        description: 'Keystore password'
        required: true
      key_password:
        description: 'Key password'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          java-version: 17
          distribution: temurin

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore keystore.jks \
            -alias ${{ github.event.inputs.alias }} \
            -keyalg RSA \
            -keysize 2048 \
            -validity 36500 \
            -dname "CN=Unknown, OU=Unknown, O=Unknown, L=Unknown, S=Unknown, C=Unknown" \
            -storepass ${{ github.event.inputs.keystore_password }} \
            -keypass ${{ github.event.inputs.key_password }}

      - name: Print signing key fingerprint
        run: |
          echo "=== SHA256 Fingerprint (untuk signingKey di index.json) ==="
          keytool -list -v \
            -keystore keystore.jks \
            -alias ${{ github.event.inputs.alias }} \
            -storepass ${{ github.event.inputs.keystore_password }} \
            | grep "SHA256"

      - name: Print base64 keystore
        run: |
          echo "=== SIGNING_KEY (copy ke GitHub secret) ==="
          base64 -w 0 keystore.jks
          echo ""